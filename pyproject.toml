[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flowproof"
version = "0.1.0"
description = "A typed, statically bounded workflow language for coding agents, with evaluation tools that are hard to fool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "hypothesis>=6.100", "pyright==1.1.414", "ruff==0.17.5"]
figures = ["matplotlib>=3.8"]

[project.scripts]
flowproof = "flowproof.cli:main"

[tool.setuptools.packages.find]
include = ["flowproof*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research/runs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "C90", "PIE", "RET", "PERF", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["flowproof", "research", "scripts"]

[tool.pyright]
include = ["flowproof", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
