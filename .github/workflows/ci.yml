name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,figures]"
      - run: ruff check .
      - run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"
        shell: bash
      - run: python -m pytest
      - name: Examples are canonical and check clean
        shell: bash
        run: |
          for f in examples/*.fp; do
            flowproof fmt --check "$f"
            flowproof check "$f"
          done

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Every sealed research record still verifies
        shell: bash
        run: |
          shopt -s nullglob
          for run in research/runs/*/; do
            flowproof evidence verify "$run"
          done